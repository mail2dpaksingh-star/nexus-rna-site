name: Monthly NEXUS Scientific Updates

on:
  schedule:
    # Monthly, 10:17 UTC on the third of each month.
    - cron: '17 10 3 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monthly-science.yml'

permissions:
  contents: write

concurrency:
  group: nexus-monthly-science
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout published website source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate data collector
        run: python3 -m py_compile scripts/update_science_digest.py
      - name: Collect public research publications and trial updates
        run: python3 scripts/update_science_digest.py --output assets/nexus-monthly-science.json
      - name: Commit updates only after successful collection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nexus-monthly-science.json
          if git diff --cached --quiet; then
            echo "No new research records."
          else
            git commit -m "Refresh monthly NEXUS scientific updates"
            git push origin HEAD:main
          fi
