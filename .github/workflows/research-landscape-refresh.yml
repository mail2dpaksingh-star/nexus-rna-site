name: Monthly NK and mRNA Research Landscape

on:
  schedule:
    - cron: '37 7 5 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-landscape-refresh.yml'
      - 'scripts/update_research_landscape.py'

permissions:
  contents: write

concurrency:
  group: nexus-research-landscape-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Check collector
        run: python3 -m py_compile scripts/update_research_landscape.py
      - name: Refresh sourced public research metadata
        run: python3 scripts/update_research_landscape.py --output assets/nexus-research-landscape.json
      - name: Commit only successful refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nexus-research-landscape.json
          if git diff --cached --quiet; then
            echo "No changes to the verified landscape"
          else
            git commit -m "Refresh public NK/mRNA research landscape index"
            git push origin HEAD:main
          fi
